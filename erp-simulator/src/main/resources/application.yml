server:
  port: ${ERP_PORT:8081}
spring:
  profiles:
    default: demo
  application:
    name: erp-simulator
  datasource:
    url: jdbc:h2:file:${ERP_DATA_DIR:./data/erp-simulator}/erp;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 4
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  flyway:
    locations: classpath:db/erp
  h2:
    console:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html
